    matchLabels:
      control-plane: mac-controller-manager
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubemacpool-allow-ingress-to-webhook
  namespace: openshift-cnv
spec:
  ingress:
  - ports:
    - port: 8000
      protocol: TCP
  podSelector:
    matchLabels:
      control-plane: mac-controller-manager
  policyTypes:
  - Ingress
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kubemacpool-mutator
webhooks:
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: kubemacpool-service
      namespace: openshift-cnv
      path: /mutate-pods
  failurePolicy: Fail
  name: mutatepods.kubemacpool.io
  namespaceSelector:
    matchExpressions:
    - key: runlevel
      operator: NotIn
      values:
      - "0"
      - "1"
    - key: openshift.io/run-level
      operator: NotIn
      values:
      - "0"
      - "1"
    - key: mutatepods.kubemacpool.io
      operator: In
      values:
      - allocate
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  sideEffects: NoneOnDryRun
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: kubemacpool-service
      namespace: openshift-cnv
      path: /mutate-virtualmachines
  failurePolicy: Fail
  name: mutatevirtualmachines.kubemacpool.io
  namespaceSelector:
    matchExpressions:
    - key: runlevel
      operator: NotIn
      values:
      - "0"
      - "1"
    - key: openshift.io/run-level
      operator: NotIn
      values:
      - "0"
      - "1"
    - key: mutatevirtualmachines.kubemacpool.io
      operator: NotIn
      values:
      - ignore
  rules:
  - apiGroups:
    - kubevirt.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - virtualmachines
  sideEffects: NoneOnDryRun
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-network-addons-operator-monitoring
  namespace: openshift-cnv
rules:
- apiGroups:
  - ""
  resources:
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-network-addons-operator-monitoring
  namespace: openshift-cnv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-network-addons-operator-monitoring
subjects:
- kind: ServiceAccount
  name: prometheus-k8s
  namespace: monitoring
---
apiVersion: v1
kind: Service
metadata:
  labels:
    prometheus.cnao.io: "true"
  name: cluster-network-addons-operator-prometheus-metrics
  namespace: openshift-cnv
spec:
  ports:
  - name: metrics
    port: 8443
    protocol: TCP
    targetPort: metrics
  selector:
    prometheus.cnao.io: "true"
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    openshift.io/cluster-monitoring: ""
    prometheus.cnao.io: "true"
  name: service-monitor-cluster-network-addons-operator
  namespace: openshift-cnv
spec:
  endpoints:
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    port: metrics
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
  namespaceSelector:
    matchNames:
    - openshift-cnv
  selector:
    matchLabels:
      prometheus.cnao.io: "true"
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus.cnao.io: "true"
  name: prometheus-rules-cluster-network-addons-operator
  namespace: openshift-cnv
spec:
  groups:
  - name: recordingRules.rules
    rules:
    - expr: sum(kubevirt_cnao_cr_kubemacpool_deployed{namespace='openshift-cnv'} or
        vector(0))
      record: cluster:kubevirt_cnao_cr_kubemacpool_deployed:sum
    - expr: sum(up{namespace='openshift-cnv', pod=~'kubemacpool-mac-controller-manager-.*'}
        or vector(0))
      record: cluster:kubevirt_cnao_kubemacpool_manager_up:sum
    - expr: sum(up{namespace='openshift-cnv', pod=~'cluster-network-addons-operator-.*'}
        or vector(0))
      record: cluster:kubevirt_cnao_operator_up:sum
    - expr: sum(kubevirt_cnao_cr_kubemacpool_deployed{namespace='openshift-cnv'} or
        vector(0))
      record: kubevirt_cnao_cr_kubemacpool_aggregated
    - expr: sum(kubevirt_kmp_duplicate_macs{namespace='openshift-cnv'} or vector(0))
      record: kubevirt_cnao_kubemacpool_duplicate_macs
    - expr: sum(up{namespace='openshift-cnv', pod=~'kubemacpool-mac-controller-manager-.*'}
        or vector(0))
      record: kubevirt_cnao_kubemacpool_manager_up
    - expr: sum(up{namespace='openshift-cnv', pod=~'cluster-network-addons-operator-.*'}
        or vector(0))
      record: kubevirt_cnao_operator_up
  - name: alerts.rules
    rules:
    - alert: CnaoDown
      annotations:
        runbook_url: https://kubevirt.io/monitoring/runbooks/CnaoDown
        summary: CNAO pod is down.
      expr: cluster:kubevirt_cnao_operator_up:sum == 0
      for: 5m
      labels:
        kubernetes_operator_component: cluster-network-addons-operator
        kubernetes_operator_part_of: kubevirt
        operator_health_impact: warning
        severity: warning
    - alert: KubemacpoolDown
      annotations:
        runbook_url: https://kubevirt.io/monitoring/runbooks/KubemacpoolDown
        summary: KubeMacpool is deployed by CNAO CR but KubeMacpool pod is down.
      expr: cluster:kubevirt_cnao_cr_kubemacpool_deployed:sum == 1 and cluster:kubevirt_cnao_kubemacpool_manager_up:sum
        == 0
      for: 5m
      labels:
        kubernetes_operator_component: cluster-network-addons-operator
        kubernetes_operator_part_of: kubevirt
        operator_health_impact: critical
        severity: critical
    - alert: NetworkAddonsConfigNotReady
      annotations:
        runbook_url: https://kubevirt.io/monitoring/runbooks/NetworkAddonsConfigNotReady
        summary: CNAO CR NetworkAddonsConfig is not ready.
      expr: sum(kubevirt_cnao_cr_ready{namespace='openshift-cnv'} or vector(0)) ==
        0
      for: 5m
      labels:
        kubernetes_operator_component: cluster-network-addons-operator
        kubernetes_operator_part_of: kubevirt
        operator_health_impact: warning
        severity: warning
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnao-allow-egress-to-cluster-api
  namespace: openshift-cnv
spec:
  egress:
  - ports:
    - port: 6443
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: allow-access-cluster-services
      operator: Exists
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnao-allow-egress-to-cluster-dns
  namespace: openshift-cnv
spec:
  egress:
  - ports:
    - port: 5353
      protocol: TCP
    - port: 5353
      protocol: UDP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
      podSelector:
        matchLabels:
          dns.operator.openshift.io/daemonset-dns: default
  podSelector:
    matchExpressions:
    - key: allow-access-cluster-services
      operator: Exists
  policyTypes:
  - Egress
