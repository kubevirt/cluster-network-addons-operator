  name: kubevirt-ipam-controller-leader-election-rolebinding
  namespace: openshift-cnv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubevirt-ipam-controller-leader-election-role
subjects:
- kind: ServiceAccount
  name: kubevirt-ipam-controller-manager
  namespace: openshift-cnv
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: ipam-virt-workloads
  name: kubevirt-ipam-controller-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubevirt-ipam-controller-manager-role
subjects:
- kind: ServiceAccount
  name: kubevirt-ipam-controller-manager
  namespace: openshift-cnv
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: kubevirt-ipam-controller-webhook-service
  labels:
    app: ipam-virt-workloads
  name: kubevirt-ipam-controller-webhook-service
  namespace: openshift-cnv
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app: ipam-virt-workloads
    control-plane: manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ipam-virt-workloads
    control-plane: manager
  name: kubevirt-ipam-controller-manager
  namespace: openshift-cnv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipam-virt-workloads
      control-plane: manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        openshift.io/required-scc: restricted-v2
      labels:
        allow-access-cluster-services: ""
        app: ipam-virt-workloads
        control-plane: manager
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
            weight: 10
          - preference:
              matchExpressions:
              - key: node-role.kubernetes.io/master
                operator: Exists
            weight: 1
      containers:
      - args:
        - --leader-elect
        - --certificates-dir=/etc/ipam-controller/certificates
        - --default-network-nad-namespace=openshift-ovn-kubernetes
        - --tls-min-version=VersionTLS12
        - --tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        - --tls-group-preferences=X25519MLKEM768,X25519,CurveP256,CurveP384
        command:
        - /manager
        env:
        - name: LOG_LEVEL
          value: "0"
        image: quay.io/openshift-cnv/container-native-virtualization-kubevirt-ipam-controller-rhel9@sha256:303f576f3b50b8b906a2ef1ecfc7b8d57d7108bb1cd993f78acee4f9f45a7cfd
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /etc/ipam-controller/certificates
          name: cert
          readOnly: true
      nodeSelector: null
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kubevirt-ipam-controller-manager
      terminationGracePeriodSeconds: 10
      tolerations: null
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: kubevirt-ipam-controller-webhook-service
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app: ipam-virt-workloads
  name: kubevirt-ipam-controller-mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kubevirt-ipam-controller-webhook-service
      namespace: openshift-cnv
      path: /mutate-v1-pod
  failurePolicy: Fail
  name: ipam-claims.k8s.cni.cncf.io
  objectSelector:
    matchLabels:
      kubevirt.io: virt-launcher
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pods
  sideEffects: None
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app: ipam-virt-workloads
  name: kubevirt-ipam-controller-allow-ingress-to-ipam-ext-webhook
  namespace: openshift-cnv
spec:
  ingress:
  - ports:
    - port: 9443
      protocol: TCP
  podSelector:
    matchLabels:
      app: ipam-virt-workloads
  policyTypes:
  - Ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-network-addons-operator-monitoring
  namespace: openshift-cnv
rules:
- apiGroups:
  - ""
  resources:
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-network-addons-operator-monitoring
  namespace: openshift-cnv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-network-addons-operator-monitoring
subjects:
- kind: ServiceAccount
  name: prometheus-k8s
  namespace: monitoring
---
apiVersion: v1
kind: Service
metadata:
  labels:
    prometheus.cnao.io: "true"
  name: cluster-network-addons-operator-prometheus-metrics
  namespace: openshift-cnv
spec:
  ports:
  - name: metrics
    port: 8443
    protocol: TCP
    targetPort: metrics
  selector:
    prometheus.cnao.io: "true"
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    openshift.io/cluster-monitoring: ""
    prometheus.cnao.io: "true"
  name: service-monitor-cluster-network-addons-operator
  namespace: openshift-cnv
spec:
  endpoints:
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    port: metrics
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
  namespaceSelector:
    matchNames:
    - openshift-cnv
  selector:
    matchLabels:
      prometheus.cnao.io: "true"
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus.cnao.io: "true"
  name: prometheus-rules-cluster-network-addons-operator
  namespace: openshift-cnv
spec:
  groups:
  - name: recordingRules.rules
    rules:
    - expr: sum(kubevirt_cnao_cr_kubemacpool_deployed{namespace='openshift-cnv'} or
        vector(0))
      record: cluster:kubevirt_cnao_cr_kubemacpool_deployed:sum
    - expr: sum(up{namespace='openshift-cnv', pod=~'kubemacpool-mac-controller-manager-.*'}
        or vector(0))
      record: cluster:kubevirt_cnao_kubemacpool_manager_up:sum
    - expr: sum(up{namespace='openshift-cnv', pod=~'cluster-network-addons-operator-.*'}
        or vector(0))
      record: cluster:kubevirt_cnao_operator_up:sum
    - expr: sum(kubevirt_cnao_cr_kubemacpool_deployed{namespace='openshift-cnv'} or
        vector(0))
      record: kubevirt_cnao_cr_kubemacpool_aggregated
    - expr: sum(kubevirt_kmp_duplicate_macs{namespace='openshift-cnv'} or vector(0))
      record: kubevirt_cnao_kubemacpool_duplicate_macs
    - expr: sum(up{namespace='openshift-cnv', pod=~'kubemacpool-mac-controller-manager-.*'}
        or vector(0))
      record: kubevirt_cnao_kubemacpool_manager_up
    - expr: sum(up{namespace='openshift-cnv', pod=~'cluster-network-addons-operator-.*'}
        or vector(0))
      record: kubevirt_cnao_operator_up
  - name: alerts.rules
    rules:
    - alert: CnaoDown
      annotations:
        runbook_url: https://kubevirt.io/monitoring/runbooks/CnaoDown
        summary: CNAO pod is down.
      expr: cluster:kubevirt_cnao_operator_up:sum == 0
      for: 5m
      labels:
        kubernetes_operator_component: cluster-network-addons-operator
        kubernetes_operator_part_of: kubevirt
        operator_health_impact: warning
        severity: warning
    - alert: KubemacpoolDown
      annotations:
        runbook_url: https://kubevirt.io/monitoring/runbooks/KubemacpoolDown
        summary: KubeMacpool is deployed by CNAO CR but KubeMacpool pod is down.
      expr: cluster:kubevirt_cnao_cr_kubemacpool_deployed:sum == 1 and cluster:kubevirt_cnao_kubemacpool_manager_up:sum
        == 0
      for: 5m
      labels:
        kubernetes_operator_component: cluster-network-addons-operator
        kubernetes_operator_part_of: kubevirt
        operator_health_impact: critical
        severity: critical
    - alert: NetworkAddonsConfigNotReady
      annotations:
        runbook_url: https://kubevirt.io/monitoring/runbooks/NetworkAddonsConfigNotReady
        summary: CNAO CR NetworkAddonsConfig is not ready.
      expr: sum(kubevirt_cnao_cr_ready{namespace='openshift-cnv'} or vector(0)) ==
        0
      for: 5m
      labels:
        kubernetes_operator_component: cluster-network-addons-operator
        kubernetes_operator_part_of: kubevirt
        operator_health_impact: warning
        severity: warning
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnao-allow-egress-to-cluster-api
  namespace: openshift-cnv
spec:
  egress:
  - ports:
    - port: 6443
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: allow-access-cluster-services
      operator: Exists
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnao-allow-egress-to-cluster-dns
  namespace: openshift-cnv
spec:
  egress:
  - ports:
    - port: 5353
      protocol: TCP
    - port: 5353
      protocol: UDP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
      podSelector:
        matchLabels:
          dns.operator.openshift.io/daemonset-dns: default
  podSelector:
    matchExpressions:
    - key: allow-access-cluster-services
      operator: Exists
  policyTypes:
  - Egress
