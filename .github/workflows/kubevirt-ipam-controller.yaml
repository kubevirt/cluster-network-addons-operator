name: Kubevirt IPAM controller Tests
on: [pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version-file: 'go.mod'

    - name: Free up disk space
      run: |
        sudo rm -rf \
          /usr/local/lib/android \
          /usr/share/dotnet \
          /opt/microsoft/powershell \
          /usr/local/share/powershell \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/local/share/vcpkg \
          /usr/local/share/chromium \
          /usr/local/share/chromedriver-linux64 \
          /usr/local/share/edge_driver \
          /usr/local/share/gecko_driver \
          /usr/share/swift \
          /etc/skel/.rustup \
          /etc/skel/.cargo \
          /usr/share/java/selenium-server*.jar \
          /usr/local/google-cloud-sdk \
          /usr/local/aws-cli \
          /usr/share/apache-maven-* \
          /usr/share/gradle-* \
          /usr/local/n \
          /usr/local/lib/node_modules \
          /opt/hostedtoolcache/CodeQL \
          /opt/hostedtoolcache/Python \
          /opt/hostedtoolcache/PyPy \
          /opt/hostedtoolcache/Ruby \
          /opt/hostedtoolcache/node
        sudo apt-get update
        mapfile -t removable_packages < <(
          dpkg-query -W -f='${Package}\n' 2>/dev/null |
            grep -E '^(azure-cli|aspnetcore-.*|clang-.*|dotnet-.*|ghc.*|firefox|google-chrome-stable|lld-.*|lldb-.*|llvm-.*|microsoft-edge-stable|mono-.*|mysql-server-core-.*|php.*|temurin-.*)$' ||
            true
        )
        if (( ${#removable_packages[@]} )); then
          sudo eatmydata apt-get purge --auto-remove -y "${removable_packages[@]}"
        fi
        sudo apt-get clean

    - name: Run e2e tests
      env:
        KIND_ALLOW_SYSTEM_WRITES: true
      run: automation/check-patch.e2e-kubevirt-ipam-controller-functests.sh

    - name: Upload logs as artifacts
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-logs
        path: ./test/e2e/_output/*.log
