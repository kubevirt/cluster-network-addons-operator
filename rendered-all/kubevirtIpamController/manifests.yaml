apiVersion: v1
kind: Service
metadata:
  labels:
    app: ipam-virt-workloads
  name: kubevirt-ipam-controller-webhook-service
  namespace: cluster-network-addons
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app: ipam-virt-workloads
    control-plane: manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ipam-virt-workloads
    control-plane: manager
  name: kubevirt-ipam-controller-manager
  namespace: cluster-network-addons
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipam-virt-workloads
      control-plane: manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        allow-access-cluster-services: ""
        app: ipam-virt-workloads
        control-plane: manager
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
            weight: 10
          - preference:
              matchExpressions:
              - key: node-role.kubernetes.io/master
                operator: Exists
            weight: 1
      containers:
      - args:
        - --leader-elect
        - --certificates-dir=
        - --tls-min-version=VersionTLS13
        - --tls-group-preferences=X25519MLKEM768,X25519,CurveP256,CurveP384
        command:
        - /manager
        env:
        - name: LOG_LEVEL
          value: "0"
        image: ghcr.io/kubevirt/ipam-controller@sha256:1f0213ac44b517ec74600934b0b57f57f244d099e679580694675bf98592d704
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      nodeSelector: null
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kubevirt-ipam-controller-manager
      terminationGracePeriodSeconds: 10
      tolerations: null
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app: ipam-virt-workloads
  name: kubevirt-ipam-controller-serving-cert
  namespace: cluster-network-addons
spec:
  dnsNames:
  - kubevirt-ipam-controller-webhook-service.cluster-network-addons.svc
  - kubevirt-ipam-controller-webhook-service.cluster-network-addons.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: kubevirt-ipam-controller-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app: ipam-virt-workloads
  name: kubevirt-ipam-controller-selfsigned-issuer
  namespace: cluster-network-addons
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: cluster-network-addons/kubevirt-ipam-controller-serving-cert
  labels:
    app: ipam-virt-workloads
  name: kubevirt-ipam-controller-mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kubevirt-ipam-controller-webhook-service
      namespace: cluster-network-addons
      path: /mutate-v1-pod
  failurePolicy: Fail
  name: ipam-claims.k8s.cni.cncf.io
  objectSelector:
    matchLabels:
      kubevirt.io: virt-launcher
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pods
  sideEffects: None
---
apiVersion: networking.k8s.io/v1
