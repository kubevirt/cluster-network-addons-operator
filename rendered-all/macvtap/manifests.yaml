apiVersion: v1
kind: Namespace
metadata:
  name: cluster-network-addons
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: macvtap-cni
  namespace: cluster-network-addons
---
apiVersion: v1
data:
  DP_MACVTAP_CONF: '[]'
kind: ConfigMap
metadata:
  name: macvtap-deviceplugin-config
  namespace: cluster-network-addons
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: macvtap-cni
  namespace: cluster-network-addons
spec:
  selector:
    matchLabels:
      name: macvtap-cni
  template:
    metadata:
      labels:
        name: macvtap-cni
    spec:
      affinity: {}
      containers:
      - command:
        - /macvtap-deviceplugin
        - -v
        - "3"
        - -logtostderr
        envFrom:
        - configMapRef:
            name: macvtap-deviceplugin-config
        image: quay.io/kubevirt/macvtap-cni@sha256:aee6d9beb458fa76b0eab34335e2b528ad9eaff74b87be2fd62658ba77cbfa87
        imagePullPolicy: IfNotPresent
        name: macvtap-cni
        resources:
          requests:
            cpu: 60m
            memory: 30Mi
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/lib/kubelet/device-plugins
          name: deviceplugin
      hostNetwork: true
      hostPID: true
      initContainers:
      - command:
        - cp
        - /macvtap-cni
        - /host/opt/cni/bin/macvtap
        image: quay.io/kubevirt/macvtap-cni@sha256:aee6d9beb458fa76b0eab34335e2b528ad9eaff74b87be2fd62658ba77cbfa87
        imagePullPolicy: IfNotPresent
        name: install-cni
        resources:
          requests:
            cpu: 10m
            memory: 15Mi
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /host/opt/cni/bin
          mountPropagation: Bidirectional
          name: cni
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      serviceAccountName: macvtap-cni
      tolerations:
      - effect: NoSchedule
        key: node.kubernetes.io/unschedulable
        operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/kubelet/device-plugins
        name: deviceplugin
      - hostPath:
          path: /opt/cni/bin
        name: cni
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnao-allow-egress-to-cluster-api
  namespace: cluster-network-addons
spec:
  egress:
  - ports:
    - port: 6443
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: allow-access-cluster-services
      operator: Exists
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnao-allow-egress-to-cluster-dns
  namespace: cluster-network-addons
spec:
  egress:
  - ports:
    - port: 53
      protocol: TCP
    - port: 53
      protocol: UDP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  podSelector:
    matchExpressions:
    - key: allow-access-cluster-services
      operator: Exists
  policyTypes:
  - Egress
